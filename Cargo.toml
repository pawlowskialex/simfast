[package]
name = "simfast"
version = "0.5.0"
edition = "2021"
description = "Hermetic, slimmed iOS simulators that boot in seconds"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
strip = true
